name: OCR shot (nightly)
# The OCR lane depends on network (tesseract core+lang from jsdelivr on first
# run) — too flaky for the per-push CI, but exactly the kind of gate that rots
# if it only ever runs by hand (test-antipatterns: "e2e chạy tay một lần").
# Nightly + manual dispatch keeps the CSP allowances honest.
on:
  schedule:
    - cron: "17 17 * * *" # 00:17 +07 daily
  workflow_dispatch: {}
jobs:
  ocr-shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SHOT: "1"
          OIA_SHOT_OCR: "1"
