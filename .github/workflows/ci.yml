name: CI
on:
  push: # branches AND tags — the dist job self-filters to v* tags
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      # F4 — dependency gate for the SHIPPED tree: fails on high/critical touching any
      # workspace project (the frozen reference apps died in reorg step 6); the one
      # acknowledged advisory (zod 3, fix only in zod 4) is listed with its removal path.
      - run: node config/audit/desktop-audit.mjs
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # workspace dist/types must exist before the desktop typecheck
      # Ratchet (reorg step 2): apps/desktop must never reach back into a web shell.
      # apps/web was deleted in step 6; the guard stays so it can never come back.
      # The baseline may only DECREASE — the desktop owns its lib copies.
      - name: "@oia-web import ratchet"
        run: |
          COUNT=$(grep -r "@oia-web" apps/desktop/src --include='*.ts' --include='*.tsx' | wc -l | tr -d ' ')
          BASE=$(grep -E '^[0-9]+$' config/baselines/oia-web-imports.baseline.txt)
          echo "desktop @oia-web imports: $COUNT (baseline: $BASE)"
          if [ "$COUNT" -gt "$BASE" ]; then echo "::error::@oia-web imports increased ($COUNT > $BASE)"; exit 1; fi
      - run: pnpm --filter @oia/desktop typecheck
      - run: pnpm --filter @oia/desktop test
      # the scripted end-to-end: mock pair -> runChat over the real Electron main process
      # (--no-sandbox: CI containers run as root; ELECTRON_SKIP_BINARY_DOWNLOAD is NOT set)
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SMOKE: "1"
      # error-path gate: kill the services process mid-session, the next call must
      # self-heal (new fork + re-init). Regression test for the crash-recovery bug.
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_CRASH_SMOKE: "1"
      # F1 gate: a second REAL app process must hit the single-instance lock and exit
      # instead of booting a second utility process over the same userData.
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SI_SMOKE: "1"

  # Reorg step 4 gate (review điểm 5): the smoke matrix runs on REAL Windows from
  # here on — not deferred to step 7. Same mock-pair gates as the ubuntu job; the
  # ratchet/audit live on ubuntu only (source-level, platform-independent).
  desktop-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @oia/desktop typecheck
      - run: pnpm --filter @oia/desktop test
      - run: npx electron .
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SMOKE: "1"
      - run: npx electron .
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_CRASH_SMOKE: "1"
      - run: npx electron .
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SI_SMOKE: "1"

  # Reorg step 7 — mac installer (arm64, unsigned per the no-signing budget plan).
  # Runs ONLY on v* tags and manual dispatch: it downloads the pinned codex pair
  # (~166 MB, cached by tag) and produces the .dmg artifact for the release.
  desktop-dist-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # workspace dist/types before the desktop build
      # D12 — cache the fetched codex tree per PINNED TAG so tag rebuilds and
      # re-runs don't re-download ~166 MB (the pin only changes with a REAL_SMOKE
      # verified bump; the key encodes the tag so a bump invalidates cleanly).
      - name: codex pin
        id: pin
        run: echo "tag=$(node -p "require('./apps/desktop/resources/codex-pin.json').tag")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: apps/desktop/resources/codex
          key: codex-${{ steps.pin.outputs.tag }}-${{ runner.os }}-arm64
      - run: pnpm --filter @oia/desktop dist:mac
      - name: sha256
        run: shasum -a 256 apps/desktop/dist/*.dmg > apps/desktop/dist/checksums.txt && cat apps/desktop/dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oia-macos-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/checksums.txt
