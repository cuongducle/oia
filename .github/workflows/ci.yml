name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      # F4 — dependency gate for the SHIPPED tree: fails on high/critical touching
      # anything except the frozen reference projects (deleted in step 6); the one
      # acknowledged advisory (zod 3, fix only in zod 4) is listed with its removal path.
      - run: node config/audit/desktop-audit.mjs
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # workspace dist/types must exist before the desktop typecheck
      # Ratchet (reorg step 2): apps/desktop must never reach back into apps/web.
      # The baseline may only DECREASE — the desktop owns its lib copies now.
      - name: "@oia-web import ratchet"
        run: |
          COUNT=$(grep -r "@oia-web" apps/desktop/src --include='*.ts' --include='*.tsx' | wc -l | tr -d ' ')
          BASE=$(grep -E '^[0-9]+$' config/baselines/oia-web-imports.baseline.txt)
          echo "desktop @oia-web imports: $COUNT (baseline: $BASE)"
          if [ "$COUNT" -gt "$BASE" ]; then echo "::error::@oia-web imports increased ($COUNT > $BASE)"; exit 1; fi
      - run: pnpm --filter @oia/desktop typecheck
      - run: pnpm --filter @oia/desktop test
      # the scripted end-to-end: mock pair -> runChat over the real Electron main process
      # (--no-sandbox: CI containers run as root; ELECTRON_SKIP_BINARY_DOWNLOAD is NOT set)
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SMOKE: "1"
      # error-path gate: kill the services process mid-session, the next call must
      # self-heal (new fork + re-init). Regression test for the crash-recovery bug.
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_CRASH_SMOKE: "1"
      # F1 gate: a second REAL app process must hit the single-instance lock and exit
      # instead of booting a second utility process over the same userData.
      - run: xvfb-run -a npx electron . --no-sandbox
        working-directory: apps/desktop
        env:
          OIA_DESKTOP_SI_SMOKE: "1"
