name: Landing site → GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "docs/screenshots/**", "config/audit/marketing-*", "docs/verification/template-marketing-assets.json", ".github/workflows/landing-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check download fallback paths
        run: node --test config/audit/marketing-downloads.test.cjs
      - name: Check marketing media references
        run: |
          python3 config/audit/marketing-assets.py --self-test
          python3 config/audit/marketing-assets.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
