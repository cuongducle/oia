name: Landing site → GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/site/**", "README.md", "docs/screenshots/**", "config/audit/marketing-*", "docs/verification/template-marketing-assets.json", ".github/workflows/landing-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oia/site build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Check downloads and bilingual landing
        run: node --test config/audit/marketing-downloads.test.cjs config/audit/landing-surface.test.cjs
      - name: Check site links, anchors and sitemap parity
        run: python3 config/audit/site-links.py --self-test && python3 config/audit/site-links.py
      - name: Check marketing media references
        run: |
          python3 config/audit/marketing-assets.py --self-test
          python3 config/audit/marketing-assets.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
