<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="1198" height="468" rx="20" fill="#fafaf9" stroke="#e5e5e8" stroke-width="2"/>
  <text x="600" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#242529">One prompt → one layered, editable scene</text>

  <line x1="58" y1="62" x2="58" y2="400" stroke="#d9d8de" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Headline layer (front) -->
  <rect x="130" y="65" width="230" height="100" rx="10" fill="#ffffff" stroke="#7050e5" stroke-width="1.5"/>
  <rect x="127" y="62" width="6" height="6" fill="#7050e5"/><rect x="354" y="62" width="6" height="6" fill="#7050e5"/>
  <rect x="127" y="162" width="6" height="6" fill="#7050e5"/><rect x="354" y="162" width="6" height="6" fill="#7050e5"/>
  <text x="142" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#7050e5">Headline · text layer</text>
  <text x="245" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5" fill="#242529">MATCHA</text>
  <text x="245" y="142" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5" fill="#242529">EVERY DAY.</text>
  <line x1="360" y1="115" x2="470" y2="110" stroke="#d9d8de" stroke-width="1.5"/>

  <!-- Caption layer -->
  <rect x="110" y="150" width="230" height="100" rx="10" fill="#ffffff" stroke="#d9d8de" stroke-width="1.5"/>
  <text x="122" y="169" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6e707b">Caption · text layer</text>
  <text x="225" y="212" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6e707b">A small cup. A brighter you.</text>
  <line x1="340" y1="200" x2="470" y2="196" stroke="#d9d8de" stroke-width="1.5"/>

  <!-- Artwork layer -->
  <rect x="90" y="235" width="230" height="100" rx="10" fill="#23402c"/>
  <text x="102" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#f6f1d7" opacity="0.75">Artwork · image layer</text>
  <circle cx="205" cy="297" r="24" fill="#46603f"/>
  <circle cx="205" cy="292" r="11" fill="#f6f1d7" opacity="0.9"/>
  <line x1="320" y1="285" x2="470" y2="282" stroke="#d9d8de" stroke-width="1.5"/>

  <!-- Artboard layer (back) -->
  <rect x="70" y="320" width="230" height="100" rx="10" fill="#ffffff" stroke="#d9d8de" stroke-width="1.5"/>
  <rect x="82" y="352" width="206" height="52" rx="4" stroke="#ececf0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="82" y="339" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6e707b">Artboard · 900 × 1200</text>
  <line x1="300" y1="370" x2="470" y2="368" stroke="#d9d8de" stroke-width="1.5"/>

  <!-- Annotations -->
  <text x="486" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#242529">Real text, not pixels</text>
  <text x="486" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6e707b">Retype, restyle, resize — fixing a typo costs zero re-rolls.</text>

  <text x="486" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#242529">Re-roll the art, keep the layout</text>
  <text x="486" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6e707b">AI edits regenerate the artwork; your copy and composition stay pinned.</text>

  <text x="486" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#242529">Exact formats, every time</text>
  <text x="486" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6e707b">IG, TikTok, A4, 16:9 or custom — export PNG · JPG · PDF · PPTX · ZIP.</text>

  <text x="486" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#242529">Every step undoable</text>
  <text x="486" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#6e707b">Full history, autosave, and multi-page projects.</text>
</svg>
