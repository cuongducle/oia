services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pixforge, POSTGRES_PASSWORD: pixforge, POSTGRES_DB: pixforge }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: pixforge, MINIO_ROOT_PASSWORD: pixforge-secret }
    ports: ["9000:9000", "9001:9001"]
