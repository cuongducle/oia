# oia.solutions static-assets Cloudflare Worker: the domain's real origin.
# Deploy the landing site:  wrangler deploy     (from the repo root)
#
# Ops details that should not live in a public repo (account owner, account
# id, who can deploy) are kept in docs/private/landing-deploy.md: that
# directory is gitignored. Wrangler needs the account id at deploy time:
# set CLOUDFLARE_ACCOUNT_ID from that note, or pass --account-id.
#
# The generated worker name is kept: renaming means re-attaching its locked
# custom-domain records. Content-addressed assets refresh instantly; a changed
# index.html may need a zone cache purge in the Cloudflare dashboard if the
# edge still serves old.
name = "twilight-sun-6b7b"
compatibility_date = "2026-10-01"

[assets]
directory = "./apps/site/dist"
not_found_handling = "404-page"
