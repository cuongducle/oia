<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- D8: the app is light by design. color-scheme:light is hygiene for a
         light-only app (keeps UA rendering pinned if Chromium ever starts
         flipping defaults with system appearance). NOTE: an earlier comment
         claimed this fixed a live white-on-white bug — that symptom was never
         reproduced under any dark mechanism (see reorg doc, 2026-10-31). -->
    <meta name="color-scheme" content="light" />
    <!--
      Step 7 CSP (revised 2026-11-01, D15 — OCR tool + tesseract removed): every
      extra token is claimed by a lane and pinned by test/csp-pin.test.ts.
      wasm-unsafe-eval = pdf.js wasm decoders (openjpeg.wasm/jbig2.wasm ship in
      pdfjs-dist 6); oia:/data:/blob: = scene assets + inline tool previews;
      blob:/data: in connect-src are kept as harmless scheme tokens for the
      conversion lane. The renderer has ZERO network origins — the jsdelivr
      allowance existed only for tesseract.js; no origin may return without a
      decision in docs/designs/desktop-only-reorg.md.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' oia: blob: data:; font-src 'self' data:; connect-src 'self' oia: blob: data:"
    />
    <title>Oia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
