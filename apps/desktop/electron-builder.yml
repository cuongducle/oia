# Reorg step 7 — packaging (D12, no-signing budget plan).
# mac arm64 + win x64 NSIS. Each target needs its own `fetch-codex --platform --arch`
# run BEFORE building (extraResources copies resources/codex, a gitignored build
# artifact) — dist:mac / dist:win do that; build each on its own OS (CI jobs).
appId: app.oia.desktop
productName: Oia
copyright: Copyright © 2026 Oia

directories:
  output: dist
  buildResources: resources

# The app runs from out/ (electron-vite output). node_modules production deps
# are packaged automatically (main externalizes them at build time). The pnpm
# workspace symlinks drag each @oia package's WHOLE dir — src/, test/ and .turbo
# logs are build noise, not app code (found by asar inspection, not by review).
files:
  - out/**/*
  - "!out/*.png" # shot-gate artifacts, not app code
  - "!**/*.map"
  - "!node_modules/**/.turbo/**"
  - "!node_modules/**/@oia/*/src/**"
  - "!node_modules/**/@oia/*/test/**"
# Known packaging characteristic (accepted 2026-10-30): pnpm nests workspace deps,
# so @oia/schema & co exist TWICE in the asar (top-level + under @oia/tasks).
# Same shape as `pnpm dev` runtime (identical resolution), so no behavior drift —
# but it means TWO module instances; anything relying on module-level state in a
# shared package would split. Revisit only if a store ever grows such state.

# D12 — codex pinned pair rides in Contents/Resources/codex; runtime.ts reads
# process.resourcesPath/codex when app.isPackaged. Source tree is created by
# `pnpm --filter @oia/desktop fetch-codex` (verifies SHA256SUMS at download).
extraResources:
  - from: resources/codex
    to: codex

# No-signing budget plan (reorg step 7): local builds are unsigned; Gatekeeper
# bypass instructions live in the README; NO auto-update channel until signing
# exists. `identity: null` keeps electron-builder from probing for identities.
afterPack: ./scripts/afterPack.mjs

# Release hardening (review F7): flip the Electron fuses at package time, on every
# platform. Without these a shipped Oia binary is a general-purpose Node runtime
# (ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect) that inherits the app's identity
# — on macOS its TCC grants too. grantFileProtocolExtraPrivileges stays default:
# the renderer loads from file:// (loadFile) and its relative font/studio assets.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # flipping fuses edits the binary — an unsigned arm64 build must be re-ad-hoc-signed or it won't launch
  resetAdHocDarwinSignature: true

mac:
  icon: resources/icons/icon.icns
  category: public.app-category.graphics-design
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
  # unsigned local builds must not be gated on notarization tooling
  notarize: false
dmg:
  title: ${productName} ${version}

# T8 — Windows x64, unsigned (same no-signing plan: SmartScreen shows "Windows
# protected your PC" → More info → Run anyway; README documents it). No auto-update
# until signing exists, so no publish/updater config here either.
win:
  icon: resources/icons/icon_1024.png # builder converts a ≥256px PNG to .ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# Per-user install under %LOCALAPPDATA%\Programs\Oia — no admin prompt (CUJ-D1).
# User data lives in %APPDATA%\Oia and is NEVER removed by uninstall or upgrade:
# projects survive both (CUJ-D2).
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
